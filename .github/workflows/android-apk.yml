# Builds an installable Android APK on every push to main and publishes it as a GitHub Release.
# Stable download link for the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/tip-or-skip.apk
#
# The APK is signed with the standard Android debug key. That is fine for testing and sharing,
# and every build installs over the last one. Google Play needs a separate upload key later.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Stamp build number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          "

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk tip-or-skip.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tip or Skip build ${{ github.run_number }}
          body: |
            Built from commit ${{ github.sha }}.
            Download tip-or-skip.apk below on an Android phone and tap it to install.
          files: tip-or-skip.apk
          make_latest: true
